<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquipShare | CAP Uniform Checklist</title>
    <link rel="icon" type="image/x-icon" href="/assets/Awesome-Boxes-Packing.svg">

    <script>window.process = { env: { NODE_ENV: 'production' } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        barcode: ['"Libre Barcode 39 Text"', 'cursive'],
                    },
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' },
                        cap: { blue: '#002f6c', red: '#ba0c2f' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    
    <script type="module" src="/js/components.js"></script>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

    <app-header></app-header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Header Banner & Score Tracker -->
        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-md border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="bg-cap-blue px-2.5 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-wider text-white border border-blue-400/30">
                        CAPR 39-1
                    </span>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight">Uniform Readiness Checklist</h1>
                <p class="text-slate-400 text-xs mt-1 max-w-2xl">
                    Interactive inspection helper for Cadet & Senior Member Service Dress (Blues) and Utility Uniforms (OCP / ABU). Select items to verify inspection compliance.
                </p>
            </div>

            <!-- Real-time Inspection Readiness Score Meter -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 w-full md:w-64 flex justify-between items-center">
                <div>
                    <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Readiness Score</div>
                    <div id="score-text" class="text-2xl font-extrabold text-emerald-400">0%</div>
                </div>
                <div class="text-right">
                    <div id="items-checked-count" class="text-xs font-bold text-slate-300">0 / 0 Ready</div>
                    <button id="btn-reset-checklist" class="text-[11px] font-bold text-cap-red hover:underline mt-1">Reset All</button>
                </div>
            </div>
        </div>

        <!-- Category Tab Buttons -->
        <div class="flex flex-wrap gap-2 border-b border-slate-200 pb-3">
            <button id="tab-btn-blues" class="tab-btn bg-cap-blue text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-user-tie"></i> Service Blues Class A & B
            </button>
            <button id="tab-btn-utility" class="tab-btn bg-white text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-slate-200">
                <i class="fa-solid fa-person-military-rifle"></i> Utility (OCP / ABU)
            </button>
            <button id="tab-btn-grooming" class="tab-btn bg-white text-slate-600 hover:bg-slate-100 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-slate-200">
                <i class="fa-solid fa-scissors"></i> Grooming & General Rules
            </button>
        </div>

        <!-- Dynamic Checklist Grid -->
        <div id="checklist-sections-container" class="space-y-6"></div>

    </main>

    <app-footer></app-footer>
    <script type="module" src="/pages/checklist.js"></script>
</body>
</html>
