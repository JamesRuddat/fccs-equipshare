<div id="cart-drawer" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden transition-opacity no-print">
    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
        <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-brand-500"></i> Shopping Pick Basket (<span id="cart-drawer-count">0</span>)
                </h3>
                <button id="btn-close-cart-drawer" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="cart-items-container" class="flex-1 p-4 overflow-y-auto divide-y divide-slate-100"></div>
            <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
                <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200">
                    <span class="text-xs font-bold text-slate-600">Total Value:</span>
                    <span id="cart-total-value" class="text-base font-extrabold text-amber-600">$0.00</span>
                </div>
                <button id="btn-proceed-picklist" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-xs uppercase tracking-wider">
                    <i class="fa-solid fa-file-invoice"></i> Proceed with Checkout
                </button>
            </div>
        </div>
    </div>
</div>
