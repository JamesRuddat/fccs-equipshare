<div id="requisition-drawer"
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden transition-opacity no-print">
    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
        <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-truck-ramp-box text-amber-400"></i> Booster Club Requisition Queue
                </h3>
                <button id="btn-close-requisition-drawer" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-3 bg-amber-50 border-b border-amber-200 text-xs text-amber-900">
                Staff requested items that need to be re-ordered. Send this compiled request list directly to the
                Booster Club for funding.
            </div>
            <div id="requisition-items-container" class="flex-1 p-4 overflow-y-auto divide-y divide-slate-100"></div>
            <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
                <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200">
                    <span class="text-xs font-bold text-slate-600">Est. Requisition Total:</span>
                    <span id="requisition-total-value" class="text-base font-extrabold text-indigo-600">$0.00</span>
                </div>
                <button id="btn-email-booster"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-xs uppercase tracking-wider">
                    <i class="fa-solid fa-envelope"></i> Email Order List to Booster Club
                </button>
            </div>
        </div>
    </div>
</div>
