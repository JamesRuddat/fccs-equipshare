<div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
        <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
            <h3 id="auth-modal-title" class="font-bold text-sm">Sign In to EquipShare</h3>
            <button id="btn-close-auth-modal" class="text-slate-400 hover:text-white p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="p-6 space-y-4 text-xs">
            <!-- LOGIN FORM -->
            <form id="login-form" class="space-y-3">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="login-email" required placeholder="member@squadron.org" class="w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-bold text-slate-700">Password</label>
                        <button type="button" id="btn-goto-reset" class="text-[11px] text-brand-600 font-bold hover:underline">Forgot Password?</button>
                    </div>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3 rounded-xl transition shadow-md">
                    Sign In
                </button>
                <p class="text-center text-slate-500 mt-2">
                    Need an account? <button type="button" id="btn-goto-register" class="text-brand-600 font-bold hover:underline">Register</button>
                </p>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" class="space-y-3 hidden">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Full Name</label>
                    <input type="text" id="reg-name" required placeholder="John Doe" class="w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Phone Number</label>
                    <input type="tel" id="reg-phone" placeholder="(555) 000-0000" class="w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="reg-email" required placeholder="cadet@squadron.org" class="w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••••" class="w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3 rounded-xl transition shadow-md">
                    Create Account
                </button>
                <p class="text-center text-slate-500 mt-2">
                    Already have an account? <button type="button" id="btn-goto-login-from-reg" class="text-brand-600 font-bold hover:underline">Sign In</button>
                </p>
            </form>

            <!-- PASSWORD RESET FORM -->
            <form id="reset-password-form" class="space-y-3 hidden">
                <p class="text-slate-500 leading-relaxed">
                    Enter your email address below and we'll send you instructions to reset your password.
                </p>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="reset-email" required placeholder="member@squadron.org" class="w-full p-2.5 border border-slate-300 rounded-lg">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3 rounded-xl transition shadow-md">
                    Send Password Reset Email
                </button>
                <p class="text-center text-slate-500 mt-2">
                    Remembered your password? <button type="button" id="btn-goto-login-from-reset" class="text-brand-600 font-bold hover:underline">Sign In</button>
                </p>
            </form>
        </div>
    </div>
</div>
